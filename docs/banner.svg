<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">libreprint</title>
  <desc id="desc">The libreprint logo and wordmark beside a paper claim ticket showing the code PQ-4819.</desc>
  <defs>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#18181b" flood-opacity="0.12"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#d4d4d8"/>
    </pattern>
  </defs>

  <!-- Ground -->
  <rect width="1280" height="420" rx="28" fill="#f4f4f5"/>
  <rect width="1280" height="420" rx="28" fill="url(#dots)" opacity="0.55"/>

  <!-- Logo mark (components: shared/components/logo.tsx, ink variant) -->
  <g transform="translate(92 84) scale(2.6)">
    <path d="M6 10C6 7.79086 7.79086 6 10 6H24L18 20H10C7.79086 20 6 18.2091 6 16V10Z" fill="#18181b"/>
    <path d="M16 8L31.5 12C33.5 12.5 34.5 14.8 33.7 16.8L28.5 29.5C27.8 31.2 25.8 32.2 24 31.8L12 29L19 14.5L16 8Z" fill="#27272a" fill-opacity="0.85"/>
    <path d="M10 24H22L16 34H10C7.79086 34 6 32.2091 6 30V26C6 24.8954 6.89543 24 8 24H10Z" fill="#3f3f46" fill-opacity="0.6"/>
    <circle cx="20" cy="20" r="2.5" fill="#ffffff"/>
  </g>

  <!-- Wordmark and tagline -->
  <text x="92" y="276" fill="#18181b" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="84" font-weight="650" letter-spacing="-3">libreprint</text>
  <text x="96" y="326" fill="#52525b" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="27">A local print queue for walk-in print shops</text>

  <!-- Claim ticket stub -->
  <g transform="translate(842 70) rotate(-4 170 140)" filter="url(#lift)">
    <path fill="#ffffff" d="M20 0H320A20 20 0 0 1 340 20V172A14 14 0 0 0 340 200V260A20 20 0 0 1 320 280H20A20 20 0 0 1 0 260V200A14 14 0 0 0 0 172V20A20 20 0 0 1 20 0Z"/>
    <text x="170" y="56" text-anchor="middle" fill="#52525b" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="500">Claim code</text>
    <rect x="58" y="96" width="224" height="34" fill="#fde68a"/>
    <text x="170" y="124" text-anchor="middle" fill="#18181b" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="58" font-weight="700" letter-spacing="-2">PQ-4819</text>
    <text x="170" y="160" text-anchor="middle" fill="#52525b" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16">Juan Dela Cruz · 2 documents</text>
    <line x1="22" y1="186" x2="318" y2="186" stroke="#d4d4d8" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="28" y="240" fill="#52525b" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15">Show this code at the counter</text>
    <circle cx="300" cy="235" r="7" fill="#10b981"/>
  </g>
</svg>
